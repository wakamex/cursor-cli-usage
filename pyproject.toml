[project]
name = "cursor-cli-usage"
version = "0.1.1"
description = "Cursor CLI account quota monitor using local Cursor authentication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cursor_cli_usage"]

[project.urls]
Homepage = "https://github.com/wakamex/cursor-cli-usage"
Source = "https://github.com/wakamex/cursor-cli-usage"

[project.scripts]
cursor-cli-usage = "cursor_cli_usage:main"
